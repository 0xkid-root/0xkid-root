name: Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - name: Build graph.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: 0xkid-root
        run: |
          mkdir -p graph-dist
          python3 - <<'EOF'
          import os, json, urllib.request
          from datetime import datetime, timedelta, timezone

          user = os.environ["GH_USER"]
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=29)
          q = """query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}"""
          body = json.dumps({"query": q, "variables": {"login": user, "from": start.strftime("%Y-%m-%dT00:00:00Z"), "to": now.strftime("%Y-%m-%dT%H:%M:%SZ")}}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=body, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json", "User-Agent": "graph-gen"})
          data = json.load(urllib.request.urlopen(req))
          days = {}
          for w in data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
              for d in w["contributionDays"]:
                  days[d["date"]] = d["contributionCount"]
          series = []
          for i in range(30):
              dt = (start + timedelta(days=i)).strftime("%Y-%m-%d")
              series.append((dt, days.get(dt, 0)))

          W, H, L, R, T, B = 900, 300, 56, 24, 56, 44
          cw, ch = W - L - R, H - T - B
          ymax = max(4, max(v for _, v in series))
          ymax = ((ymax + 3) // 4) * 4
          pts = [(L + cw * i / 29, T + ch - ch * v / ymax) for i, (_, v) in enumerate(series)]

          def smooth(p):
              d = "M%.1f,%.1f" % p[0]
              for i in range(len(p) - 1):
                  p0, p1, p2, p3 = p[max(i - 1, 0)], p[i], p[i + 1], p[min(i + 2, len(p) - 1)]
                  c1 = (p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6)
                  c2 = (p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6)
                  c1 = (c1[0], min(max(c1[1], T), T + ch))
                  c2 = (c2[0], min(max(c2[1], T), T + ch))
                  d += " C%.1f,%.1f %.1f,%.1f %.1f,%.1f" % (c1 + c2 + p2)
              return d

          line = smooth(pts)
          area = line + " L%.1f,%.1f L%.1f,%.1f Z" % (pts[-1][0], T + ch, pts[0][0], T + ch)
          total = sum(v for _, v in series)
          o = []
          o.append('<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d" font-family="Segoe UI,Arial,sans-serif">' % (W, H, W, H))
          o.append('<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24c6dc" stop-opacity=".45"/><stop offset="1" stop-color="#24c6dc" stop-opacity="0"/></linearGradient><filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>')
          o.append('<style>.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.5s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}.ar{opacity:0;animation:fade 1.5s 1.2s ease-out forwards}@keyframes fade{to{opacity:1}}.dt{opacity:0;animation:fade .6s 2.2s ease-out forwards}</style>')
          o.append('<rect width="%d" height="%d" rx="14" fill="#0d1117" stroke="#30363d"/>' % (W, H))
          o.append('<text x="%d" y="32" text-anchor="middle" fill="#24c6dc" font-size="17" font-weight="600">%s\'s Contribution Graph  ·  %d contributions in 30 days</text>' % (W // 2, user, total))
          for k in range(5):
              y = T + ch * k / 4
              val = int(ymax - ymax * k / 4)
              o.append('<line x1="%d" y1="%.1f" x2="%d" y2="%.1f" stroke="#21262d" stroke-width="1"/>' % (L, y, W - R, y))
              o.append('<text x="%d" y="%.1f" text-anchor="end" fill="#8b949e" font-size="11">%d</text>' % (L - 8, y + 4, val))
          for i in range(0, 30, 3):
              dt = datetime.strptime(series[i][0], "%Y-%m-%d")
              o.append('<text x="%.1f" y="%d" text-anchor="middle" fill="#8b949e" font-size="11">%s</text>' % (pts[i][0], H - 18, dt.strftime("%b %d")))
          o.append('<path class="ar" d="%s" fill="url(#g)"/>' % area)
          o.append('<path class="ln" pathLength="1" d="%s" fill="none" stroke="#24c6dc" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>' % line)
          for (x, y), (dt, v) in zip(pts, series):
              o.append('<circle class="dt" cx="%.1f" cy="%.1f" r="3" fill="#0d1117" stroke="#24c6dc" stroke-width="1.8"><title>%s: %d</title></circle>' % (x, y, dt, v))
          o.append('</svg>')
          open("graph-dist/graph.svg", "w").write("\n".join(o))
          print("total contributions:", total)
          EOF

      - name: Publish graph to "graph" branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: graph
          publish_dir: graph-dist
